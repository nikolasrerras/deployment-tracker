
services:
  postgres:
    image: postgres:17
    container_name: deployment-tracker-postgres

    environment:
      POSTGRES_DB: deployment_tracker
      POSTGRES_USER: deployment_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U deployment_tracker -d deployment_tracker"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: deployment-tracker:${IMAGE_TAG:-local}
    container_name: deployment-tracker-api

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deployment_tracker
      SPRING_DATASOURCE_USERNAME: deployment_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
